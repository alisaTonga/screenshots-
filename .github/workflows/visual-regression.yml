name: Visual Regression

on:
  schedule:
    - cron: '0 5 * * *'      # daily at 05:00 UTC (06:00/07:00 Germany, depending on DST)
  push:
    branches: [main]
  workflow_dispatch:          # lets you trigger a run manually from the Actions tab

concurrency:
  group: visual-regression
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      # v5 of these actions run on the Node 24 action runtime. Node 20 is
      # deprecated on GitHub's runners (EOL April 2026), so v4 actions — which
      # run on node20 — now fail. See:
      # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22      # active LTS; runs the tests (Node 20 is EOL)

      - run: npm install
      - run: npx playwright install --with-deps chromium webkit

      - name: Run visual regression tests
        run: npm test

      - name: Upload HTML report (always, so failures are inspectable)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload visual issues (expected/actual/diff of failing pages)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: visual-issues
          path: issues/
          retention-days: 14
          if-no-files-found: ignore   # no artifact when every page passed
